services:
  - type: web
    name: hackathon-scores-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_PATH
        value: ./hackathon.db
      - key: CORS_ORIGIN
        value: https://hackathon-scores-frontend.onrender.com

  - type: web
    name: hackathon-scores-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SOCKET_URL
        value: https://hackathon-scores-backend.onrender.com
